<svg width="900" height="200" viewBox="0 0 900 200" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Johan Stefanes">
  <defs>
    <linearGradient id="flow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"  stop-color="#7aa2ff"/>
      <stop offset="35%" stop-color="#a78bfa"/>
      <stop offset="70%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#7aa2ff"/>
      <animateTransform attributeName="gradientTransform" type="translate"
        from="-1 0" to="1 0" dur="6s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <text x="50%" y="120" text-anchor="middle"
    font-family="'JetBrains Mono','Fira Code',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace"
    font-size="96" font-weight="700" letter-spacing="2"
    fill="url(#flow)">Johan Stefanes</text>
</svg>
